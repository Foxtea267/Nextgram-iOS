name: Build Nextgram IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nextgram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BUNDLE_ID: jp.foxtea.nextgram
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache Bazel downloads and build outputs
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: nextgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}
          restore-keys: nextgram-bazel-${{ runner.os }}-

      - name: Configure re-signable build
        run: |
          cat > local.bazelrc <<'EOF'
          build --//Telegram:disableExtensions
          EOF

      - name: Write build configuration
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_API_ID}" || -z "${TELEGRAM_API_HASH}" ]]; then
            TELEGRAM_API_ID="$(python3 -c 'import json; print(json.load(open("build-system/appstore-configuration.json"))["api_id"])')"
            TELEGRAM_API_HASH="$(python3 -c 'import json; print(json.load(open("build-system/appstore-configuration.json"))["api_hash"])')"
          fi
          mkdir -p build-input
          cat > build-input/nextgram-ci.json <<JSON
          {
            "bundle_id": "${BUNDLE_ID}",
            "api_id": "${TELEGRAM_API_ID}",
            "api_hash": "${TELEGRAM_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "nextgram",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          JSON

      - name: Import disposable build certificate
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Generate matching disposable provisioning profile
        run: |
          set -euo pipefail
          CODESIGNING_PATH="build-input/nextgram-codesigning"
          PROFILE_PLIST="${RUNNER_TEMP}/nextgram-profile.plist"
          mkdir -p "${CODESIGNING_PATH}/certs" "${CODESIGNING_PATH}/profiles"
          cp build-system/fake-codesigning/certs/* "${CODESIGNING_PATH}/certs/"
          security cms -D -i build-system/fake-codesigning/profiles/Telegram.mobileprovision > "${PROFILE_PLIST}"
          python3 - "${PROFILE_PLIST}" "${BUNDLE_ID}" <<'PY'
          import plistlib
          import sys

          path, bundle_id = sys.argv[1:]
          old_bundle_id = "ph.telegra.Telegraph"

          def replace(value):
              if isinstance(value, str):
                  return value.replace(old_bundle_id, bundle_id)
              if isinstance(value, list):
                  return [replace(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace(item) for key, item in value.items()}
              return value

          with open(path, "rb") as source:
              profile = plistlib.load(source)
          profile.pop("DER-Encoded-Profile", None)
          with open(path, "wb") as destination:
              plistlib.dump(replace(profile), destination)
          PY
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning temp.keychain | awk -F '"' 'NR == 1 { print $2 }')"
          test -n "${SIGNING_IDENTITY}"
          security cms -S -k temp.keychain -N "${SIGNING_IDENTITY}" \
            -i "${PROFILE_PLIST}" \
            -o "${CODESIGNING_PATH}/profiles/Telegram.mobileprovision"

      - name: Build arm64 IPA
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))"
          python3 build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-input/nextgram-ci.json \
            --codesigningInformationPath build-input/nextgram-codesigning \
            --buildNumber "$BUILD_NUMBER" \
            --configuration release_arm64

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          rm -rf build/package
          mkdir -p build/artifacts build/dSYMs build/package
          ditto -x -k bazel-bin/Telegram/Telegram.ipa build/package
          APP_PATH="$(find build/package/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "${APP_PATH}"
          test "$(plutil -extract CFBundleIdentifier raw "${APP_PATH}/Info.plist")" = "${BUNDLE_ID}"
          find "${APP_PATH}" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "${APP_PATH}" -name embedded.mobileprovision -delete
          (
            cd build/package
            /usr/bin/zip -qry ../artifacts/Nextgram.ipa Payload
          )
          find bazel-bin/Telegram -maxdepth 1 -name '*.dSYM' -exec cp -R {} build/dSYMs/ \;
          if find build/dSYMs -maxdepth 1 -name '*.dSYM' | grep -q .; then
            ditto -c -k --sequesterRsrc --keepParent build/dSYMs build/artifacts/Nextgram.dSYMs.zip
          fi

      - name: Upload IPA and symbols
        uses: actions/upload-artifact@v4
        with:
          name: Nextgram-${{ github.sha }}
          path: |
            build/artifacts/Nextgram.ipa
            build/artifacts/Nextgram.dSYMs.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish standalone IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(TZ=Asia/Hong_Kong date +%Y%m%d)$(printf '%03d' "${GITHUB_RUN_NUMBER}")"
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" build/artifacts/Nextgram.ipa --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${VERSION}" build/artifacts/Nextgram.ipa \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes "Standalone re-signable IPA. Bundle ID: ${BUNDLE_ID}. Re-sign before installation."
          fi
