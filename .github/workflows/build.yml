name: Build Nextgram IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nextgram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}
      app_version: ${{ steps.configuration.outputs.app_version }}
      release_version: ${{ steps.configuration.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Define variants and shared version
        id: configuration
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("build-system/nextgram-variants.json", encoding="utf-8") as source:
              variants = json.load(source)
          assert variants, "No Nextgram variants configured"
          for field in ("variant", "bundle_id", "api_id", "api_hash_secret"):
              assert len({entry[field] for entry in variants}) == len(variants), f"Duplicate {field}"
          for entry in variants:
              assert re.fullmatch(r"[A-Za-z][A-Za-z0-9]*", entry["variant"]), "Invalid variant name"
              assert re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", entry["bundle_id"]), "Invalid bundle ID"
              assert entry["api_id"].isdigit() and int(entry["api_id"]) > 0, "Invalid API ID"
              assert re.fullmatch(r"[A-Z][A-Z0-9_]*", entry["api_hash_secret"]), "Invalid Secret name"
          today = datetime.now(ZoneInfo("Asia/Hong_Kong"))
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          print("matrix=" + json.dumps({"include": variants}, separators=(",", ":")))
          print(f"app_version={today:%Y.%m%d}.{run_number}")
          print(f"release_version={today:%Y%m%d}{run_number:03d}")
          PY

  build:
    name: Build ${{ matrix.variant }} compatibility IPA
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      VARIANT: ${{ matrix.variant }}
      BUNDLE_ID: ${{ matrix.bundle_id }}
      TELEGRAM_API_ID: ${{ matrix.api_id }}
      TELEGRAM_API_HASH: ${{ secrets[matrix.api_hash_secret] }}
      API_HASH_SECRET_NAME: ${{ matrix.api_hash_secret }}
      NEXTGRAM_APP_VERSION: ${{ needs.prepare.outputs.app_version }}

    steps:
      - name: Validate variant credentials
        run: |
          set -euo pipefail
          if [[ ! "${TELEGRAM_API_HASH}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Set ${API_HASH_SECRET_NAME} to the matching ${VARIANT} API hash before building."
            exit 1
          fi

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache Bazel downloads and build outputs
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: nextgram-bazel-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}
          restore-keys: |
            nextgram-bazel-${{ runner.os }}-${{ matrix.variant }}-
            nextgram-bazel-${{ runner.os }}-

      - name: Configure re-signable build
        run: |
          cat > local.bazelrc <<'EOF'
          build --//Telegram:disableExtensions
          EOF

      - name: Write build configuration
        run: |
          set -euo pipefail
          mkdir -p build-input
          cat > build-input/nextgram-ci.json <<JSON
          {
            "bundle_id": "${BUNDLE_ID}",
            "api_id": "${TELEGRAM_API_ID}",
            "api_hash": "${TELEGRAM_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "nextgram",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          JSON

      - name: Import disposable build certificate
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Generate matching disposable provisioning profile
        run: |
          set -euo pipefail
          CODESIGNING_PATH="build-input/nextgram-codesigning"
          PROFILE_PLIST="${RUNNER_TEMP}/nextgram-profile.plist"
          SIGNING_PEM="${RUNNER_TEMP}/nextgram-signing.pem"
          mkdir -p "${CODESIGNING_PATH}/certs" "${CODESIGNING_PATH}/profiles"
          cp build-system/fake-codesigning/certs/* "${CODESIGNING_PATH}/certs/"
          openssl smime -inform der -verify -noverify \
            -in build-system/fake-codesigning/profiles/Telegram.mobileprovision \
            -out "${PROFILE_PLIST}"
          python3 - "${PROFILE_PLIST}" "${BUNDLE_ID}" <<'PY'
          import plistlib
          import sys

          path, bundle_id = sys.argv[1:]
          old_bundle_id = "ph.telegra.Telegraph"

          def replace(value):
              if isinstance(value, str):
                  return value.replace(old_bundle_id, bundle_id)
              if isinstance(value, list):
                  return [replace(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace(item) for key, item in value.items()}
              return value

          with open(path, "rb") as source:
              profile = plistlib.load(source)
          profile.pop("DER-Encoded-Profile", None)
          with open(path, "wb") as destination:
              plistlib.dump(replace(profile), destination)
          PY
          openssl pkcs12 -in build-system/fake-codesigning/certs/SelfSigned.p12 \
            -passin pass: -nodes -legacy -out "${SIGNING_PEM}"
          openssl smime -sign -binary -nodetach -outform der \
            -in "${PROFILE_PLIST}" \
            -signer "${SIGNING_PEM}" \
            -inkey "${SIGNING_PEM}" \
            -out "${CODESIGNING_PATH}/profiles/Telegram.mobileprovision"

      - name: Build arm64 IPA
        run: |
          set -euo pipefail
          python3 - "${NEXTGRAM_APP_VERSION}" <<'PY'
          import json
          import sys

          path = "versions.json"
          with open(path, "r", encoding="utf-8") as source:
              versions = json.load(source)
          versions["app"] = sys.argv[1]
          with open(path, "w", encoding="utf-8") as destination:
              json.dump(versions, destination, indent=4)
              destination.write("\n")
          PY
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))"
          python3 build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-input/nextgram-ci.json \
            --codesigningInformationPath build-input/nextgram-codesigning \
            --buildNumber "$BUILD_NUMBER" \
            --configuration release_arm64

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          rm -rf build/package
          mkdir -p build/artifacts build/dSYMs build/package
          ditto -x -k bazel-bin/Telegram/Telegram.ipa build/package
          APP_PATH="$(find build/package/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "${APP_PATH}"
          test "$(plutil -extract CFBundleIdentifier raw "${APP_PATH}/Info.plist")" = "${BUNDLE_ID}"
          test "$(plutil -extract CFBundleShortVersionString raw "${APP_PATH}/Info.plist")" = "${NEXTGRAM_APP_VERSION}"
          test "$(plutil -extract CFBundleDisplayName raw "${APP_PATH}/Info.plist")" = "Nextgram"
          test "$(plutil -extract CFBundleName raw "${APP_PATH}/Info.plist")" = "Nextgram"
          find "${APP_PATH}" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "${APP_PATH}" -name embedded.mobileprovision -delete
          (
            cd build/package
            /usr/bin/zip -qry "../artifacts/Nextgram-${VARIANT}.ipa" Payload
          )
          find bazel-bin/Telegram -maxdepth 1 -name '*.dSYM' -exec cp -R {} build/dSYMs/ \;
          if find build/dSYMs -maxdepth 1 -name '*.dSYM' | grep -q .; then
            ditto -c -k --sequesterRsrc --keepParent build/dSYMs "build/artifacts/Nextgram-${VARIANT}.dSYMs.zip"
          fi

      - name: Upload IPA and symbols
        uses: actions/upload-artifact@v4
        with:
          name: Nextgram-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build/artifacts/Nextgram-${{ matrix.variant }}.ipa
            build/artifacts/Nextgram-${{ matrix.variant }}.dSYMs.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish all compatibility IPAs
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTGRAM_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      NEXTGRAM_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Nextgram-*-${{ github.sha }}
          path: build/artifacts
          merge-multiple: true
      - name: Verify all IPA identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import zipfile
          from pathlib import Path

          with open("build-system/nextgram-variants.json", encoding="utf-8") as source:
              variants = json.load(source)
          expected_files = {f"Nextgram-{entry['variant']}.ipa" for entry in variants}
          actual_files = {path.name for path in Path("build/artifacts").glob("*.ipa")}
          assert actual_files == expected_files, "Missing or unexpected compatibility IPA"
          for entry in variants:
              filename = f"Nextgram-{entry['variant']}.ipa"
              with zipfile.ZipFile(Path("build/artifacts") / filename) as archive:
                  info_paths = [name for name in archive.namelist() if name.startswith("Payload/") and name.endswith(".app/Info.plist") and name.count("/") == 2]
                  assert len(info_paths) == 1, f"Invalid app layout in {filename}"
                  info = plistlib.loads(archive.read(info_paths[0]))
                  assert info["CFBundleIdentifier"] == entry["bundle_id"], f"Wrong bundle ID in {filename}"
                  assert info["CFBundleShortVersionString"] == os.environ["NEXTGRAM_APP_VERSION"], f"Wrong version in {filename}"
                  assert info["CFBundleDisplayName"] == "Nextgram", f"Wrong display name in {filename}"
              print(f"Verified {filename}: {entry['bundle_id']}")
          PY
      - name: Publish standalone IPAs to one Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${NEXTGRAM_RELEASE_VERSION}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          mkdir -p build
          {
            echo "## 本次更新 / What's Changed"
            echo
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              git log --no-merges --pretty=format:'- %s (`%h`)' "${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              git log --no-merges -n 20 --pretty=format:'- %s (`%h`)'
            fi
            echo
            echo
            echo "App version: ${NEXTGRAM_APP_VERSION}"
            echo
            echo "## 选择安装包 / Choose a compatibility IPA"
            echo
            python3 - <<'PY'
          import json
          with open("build-system/nextgram-variants.json", encoding="utf-8") as source:
              variants = json.load(source)
          print("| IPA | Bundle ID | 避免同时安装的原版 |")
          print("| --- | --- | --- |")
          for entry in variants:
              print(f"| Nextgram-{entry['variant']}.ipa | `{entry['bundle_id']}` | {entry['variant']} |")
          PY
            echo
            echo "Standalone re-signable IPA. Re-sign before installation."
            echo "四种包的功能、Nextgram 名称和图标相同；请选择手机未安装对应原版的兼容包。"
            echo "这些兼容包不是 jp.foxtea.nextgram 的原位更新，不会自动迁移其账号和本地缓存。"
            echo "推送兼容性仍需在企业重签后实测，不保证通知恢复。"
          } > build/release-notes.md
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --notes-file build/release-notes.md --repo "${GITHUB_REPOSITORY}"
            gh release upload "${VERSION}" build/artifacts/Nextgram-*.ipa --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${VERSION}" build/artifacts/Nextgram-*.ipa \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes-file build/release-notes.md
          fi
